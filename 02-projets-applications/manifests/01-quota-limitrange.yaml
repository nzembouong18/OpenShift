apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: lab-apps
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    persistentvolumeclaims: "3"
    count/routes.route.openshift.io: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: lab-apps
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
    - type: Pod
      max:
        cpu: "2"
        memory: 2Gi
