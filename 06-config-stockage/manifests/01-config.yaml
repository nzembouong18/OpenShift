apiVersion: v1
kind: ConfigMap
metadata: {name: app-cfg, namespace: lab-stockage}
data:
  LOG_LEVEL: info
  settings.conf: |
    log_level=info
    feature_x=true
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app, namespace: lab-stockage}
spec:
  replicas: 1
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sh", "-c", "sleep infinity"]
          envFrom:
            - configMapRef: {name: app-cfg}
          volumeMounts:
            - {name: cfg, mountPath: /etc/app}
          resources: {requests: {cpu: 10m, memory: 16Mi}}
      volumes:
        - name: cfg
          configMap:
            name: app-cfg
            items: [{key: settings.conf, path: settings.conf}]
