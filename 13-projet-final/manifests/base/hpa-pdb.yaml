apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vote-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: vote-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vote-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: vote-api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vote-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: vote-frontend}
