apiVersion: v1
kind: Secret
metadata: {name: postgres, namespace: lab-stockage}
type: Opaque
stringData:
  POSTGRESQL_USER: app
  POSTGRESQL_PASSWORD: change-me-formation
  POSTGRESQL_DATABASE: vote
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: lab-stockage}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: lab-stockage}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-15-c9s:latest
          ports: [{containerPort: 5432}]
          envFrom: [{secretRef: {name: postgres}}]
          readinessProbe:
            exec: {command: ["/usr/libexec/check-container"]}
            initialDelaySeconds: 5
          livenessProbe:
            exec: {command: ["/usr/libexec/check-container", "--live"]}
            initialDelaySeconds: 120
          volumeMounts: [{name: data, mountPath: /var/lib/pgsql/data}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: lab-stockage}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
