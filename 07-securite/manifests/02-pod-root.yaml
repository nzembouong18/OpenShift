# Pod qui exige root : refusé/échoue sous restricted-v2
apiVersion: v1
kind: Pod
metadata:
  name: root
  namespace: lab-secu
spec:
  containers:
    - name: nginx
      image: docker.io/library/nginx:1.27
      securityContext:
        runAsUser: 0
      resources:
        requests: {cpu: 10m, memory: 32Mi}
