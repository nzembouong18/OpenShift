# Exemple LEGACY (déprécié) : à migrer vers un Deployment (lab 4.7)
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: legacy
  namespace: lab-workloads
spec:
  replicas: 2
  selector:
    app: legacy
  strategy:
    type: Rolling
    rollingParams:
      maxSurge: 1
      maxUnavailable: 0
      timeoutSeconds: 120
  triggers:
    - type: ConfigChange
  template:
    metadata:
      labels:
        app: legacy
    spec:
      containers:
        - name: legacy
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 20m, memory: 32Mi}
