apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vote-envs
  namespace: openshift-gitops
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - {env: dev,     namespace: vote-dev}
          - {env: staging, namespace: vote-staging}
          - {env: prod,    namespace: vote-prod}
  template:
    metadata:
      name: 'vote-{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/nzembouong18/OpenShift
        targetRevision: main
        path: '13-projet-final/manifests/overlays/{{.env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: '{{ eq .env "prod" | not }}'
        syncOptions:
          - CreateNamespace=true
