# ValidatingAdmissionPolicy est GA (v1) depuis Kubernetes 1.30 (OCP 4.17+) ; avant : v1beta1 / fonctionnalité à activer.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: no-latest-and-memory-limits}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: "object.spec.template.spec.containers.all(c, !c.image.endsWith(':latest') && c.image.contains(':') || c.image.contains('@sha256:'))"
      message: "Les images doivent être taguées (pas de :latest) ou référencées par digest."
    - expression: "object.spec.template.spec.containers.all(c, has(c.resources) && has(c.resources.limits) && 'memory' in c.resources.limits)"
      message: "Chaque conteneur doit définir resources.limits.memory."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: no-latest-and-memory-limits}
spec:
  policyName: no-latest-and-memory-limits
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        env: prod
