# Deux versions simulées par ConfigMap + nginx ; la réponse contient v1 ou v2
apiVersion: v1
kind: ConfigMap
metadata: {name: page-v1, namespace: lab-reseau}
data: {index.html: "v1\n"}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: page-v2, namespace: lab-reseau}
data: {index.html: "v2\n"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app-v1, namespace: lab-reseau}
spec:
  replicas: 1
  selector: {matchLabels: {app: app-v1}}
  template:
    metadata: {labels: {app: app-v1}}
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: page, mountPath: /opt/app-root/src/index.html, subPath: index.html}]
          resources: {requests: {cpu: 10m, memory: 32Mi}}
      volumes: [{name: page, configMap: {name: page-v1}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app-v2, namespace: lab-reseau}
spec:
  replicas: 1
  selector: {matchLabels: {app: app-v2}}
  template:
    metadata: {labels: {app: app-v2}}
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: page, mountPath: /opt/app-root/src/index.html, subPath: index.html}]
          resources: {requests: {cpu: 10m, memory: 32Mi}}
      volumes: [{name: page, configMap: {name: page-v2}}]
---
apiVersion: v1
kind: Service
metadata: {name: app-v1, namespace: lab-reseau}
spec:
  selector: {app: app-v1}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: app-v2, namespace: lab-reseau}
spec:
  selector: {app: app-v2}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ab
  namespace: lab-reseau
  annotations:
    haproxy.router.openshift.io/disable_cookies: "true"
spec:
  to: {kind: Service, name: app-v1, weight: 90}
  alternateBackends:
    - {kind: Service, name: app-v2, weight: 10}
  port: {targetPort: 8080}
