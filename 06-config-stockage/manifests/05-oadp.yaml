# Prérequis : Operator OADP installé dans openshift-adp ; Secret cloud-credentials (clé S3)
apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata: {name: dpa-formation, namespace: openshift-adp}
spec:
  configuration:
    velero:
      defaultPlugins: [openshift, aws, csi]
    nodeAgent:
      enable: true
      uploaderType: kopia
  backupLocations:
    - velero:
        provider: aws
        default: true
        credential: {name: cloud-credentials, key: cloud}
        objectStorage: {bucket: oadp-formation, prefix: velero}
        config:
          region: minio
          s3ForcePathStyle: "true"
          s3Url: http://minio.minio.svc:9000
---
apiVersion: velero.io/v1
kind: Backup
metadata: {name: lab-stockage-1, namespace: openshift-adp}
spec:
  includedNamespaces: [lab-stockage]
  snapshotMoveData: false
  defaultVolumesToFsBackup: true
  ttl: 168h0m0s
