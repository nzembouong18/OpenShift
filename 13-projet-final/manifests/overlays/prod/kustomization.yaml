apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vote-prod
resources:
  - ../../base
labels:
  - pairs:
      environment: prod
    includeSelectors: false
patches:
  - target: {kind: Deployment, name: vote-api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: {kind: Deployment, name: vote-frontend}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
images:
  - name: vote-api
    newName: image-registry.openshift-image-registry.svc:5000/lab-cicd/vote-api
    newTag: latest
