apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: tmp-writable
  annotations:
    kubernetes.io/description: "Basée sur restricted-v2 : root FS en lecture seule obligatoire, volumes limités"
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
readOnlyRootFilesystem: true
requiredDropCapabilities: [ALL]
defaultAddCapabilities: null
fsGroup:
  type: MustRunAs
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - projected
  - secret
  - persistentVolumeClaim
priority: null
users: []
groups: []
