apiVersion: v1
kind: ServiceAccount
metadata: {name: auditor, namespace: lab-secu}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pod-reader, namespace: lab-secu}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: auditor-pod-reader, namespace: lab-secu}
subjects:
  - {kind: ServiceAccount, name: auditor, namespace: lab-secu}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
