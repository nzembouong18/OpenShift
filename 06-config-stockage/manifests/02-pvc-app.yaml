apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data, namespace: lab-stockage}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pvc-app, namespace: lab-stockage}
spec:
  replicas: 1
  strategy: {type: Recreate}      # RWO : un seul Pod à la fois
  selector: {matchLabels: {app: pvc-app}}
  template:
    metadata: {labels: {app: pvc-app}}
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sh", "-c", "sleep infinity"]
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
