# Hub ACM : politique imposant un LimitRange par défaut dans les namespaces env=prod des clusters ciblés
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: limitrange-prod
  namespace: policies
  annotations:
    policy.open-cluster-management.io/standards: CIS
    policy.open-cluster-management.io/categories: CM Configuration Management
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: limitrange-prod
        spec:
          remediationAction: inform
          severity: medium
          namespaceSelector:
            matchLabels: {env: prod}
            include: ["*"]
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: LimitRange
                metadata:
                  name: default-limits
                spec:
                  limits:
                    - type: Container
                      defaultRequest: {cpu: 50m, memory: 64Mi}
                      default: {cpu: 500m, memory: 512Mi}
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: prod-clusters
  namespace: policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels: {environment: prod}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: limitrange-prod
  namespace: policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: prod-clusters
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: limitrange-prod
