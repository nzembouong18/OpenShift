apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: vote-binding
  namespace: lab-cicd
spec:
  params:
    - {name: git-url, value: $(body.repository.clone_url)}
    - {name: git-revision, value: $(body.head_commit.id)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: vote-template
  namespace: lab-cicd
spec:
  params:
    - name: git-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: build-and-deploy-
      spec:
        pipelineRef:
          name: build-and-deploy
        taskRunTemplate:
          serviceAccountName: pipeline
        params:
          - {name: git-url, value: $(tt.params.git-url)}
          - {name: git-revision, value: main}
          - {name: image, value: image-registry.openshift-image-registry.svc:5000/lab-cicd/vote-api}
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: vote-listener
  namespace: lab-cicd
spec:
  serviceAccountName: pipeline
  triggers:
    - name: push
      bindings:
        - ref: vote-binding
      template:
        ref: vote-template
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: el-vote-listener
  namespace: lab-cicd
spec:
  to:
    kind: Service
    name: el-vote-listener
  port:
    targetPort: http-listener
